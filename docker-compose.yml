services:                                                                                                                                                                                                                  
  backend:                                                                                                                                                                                                                 
    build: ./apps/api-server                                                                                                                                                                                               
    ports:                                                                                                                                                                                                                 
      - "8000:8000"                                                                                                                                                                                                        
    depends_on:                                                                                                                                                                                                            
      - db                                                                                                                                                                                                                 
      - minio                                                                                                                                                                                                              
      - vector_db                                                                                                                                                                                                          
      - redis                                                                                                                                                                                                              
    env_file:                                                                                                                                                                                                              
      - .env                                                                                                                                                                                                               
    environment:                                                                                                                                                                                                           
      - DATABASE_URL=${DATABASE_URL}                                                                                                                                                                                       
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}                                                                                                                                                                          
      - VECTOR_DB_URL=${QDRANT_URL}                                                                                                                                                                                        
      - REDIS_URL=${REDIS_URL}                                                                                                                                                                                             
    command: uvicorn main:app --host 0.0.0.0 --port 8000                                                                                                                                                                   

  seeder:
    build:
      context: .
      dockerfile: Dockerfile.seeder
    container_name: rag_seeder
    volumes:
      - ./dataset:/app
      - ./app/workers:/app/workers
    environment:
      - PYTHONPATH=/app:/app/workers
    depends_on:
      - backend      
      - vector_db  
      - db

  db:                                                                                                                                                                                                                      
    image: postgres:15-alpine                                                                                                                                                                                              
    environment:                                                                                                                                                                                                           
      - POSTGRES_DB=${POSTGRES_DB}                                                                                                                                                                                                  
      - POSTGRES_USER=${POSTGRES_USER}                                                                                                                                                                                             
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}                                                                                                                                                                                        
    volumes:                                                                                                                                                                                                               
      - db_data:/var/lib/postgresql/data                                                                                                                                                                                   
                                                                                                                                                                                                                           
  minio:                                                                                                                                                                                                                   
    image: minio/minio:latest                                                                                                                                                                                              
    ports:                                                                                                                                                                                                                 
      - "9000:9000"                                                                                                                                                                                                        
      - "9001:9001"                                                                                                                                                                                                        
    environment:                                                                                                                                                                                                           
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}                                                                                                                                                                                
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}                                                                                                                                                                            
    volumes:                                                                                                                                                                                                               
      - minio_data:/data                                                                                                                                                                                                   
    command: server --console-address ":9001" /data                                                                                                                                                                        
                                                                                                                                                                                                                           
  vector_db:                                                                                                                                                                                                               
    image: qdrant/qdrant:latest                                                                                                                                                                                            
    ports:                                                                                                                                                                                                                 
      - "6333:6333"                                                                                                                                                                                                        
    volumes:                                                                                                                                                                                                               
      - qdrant_data:/qdrant/storage                                                                                                                                                                                        
                                                                                                                                                                                                                           
  redis:                                                                                                                                                                                                                   
    image: redis:7-alpine                                                                                                                                                                                                  
    ports:                                                                                                                                                                                                                 
      - "6379:6379"                                                                                                                                                                                                        
                                                                                                                                                                                                                           
  worker:                                                                                                                                                                                                                  
    build: ./apps/api-server                                                                                                                                                                                             
    command: celery -A app.workers.celery_app worker -Q ingestion --loglevel=info --concurrency=1                                                                                                                                          
    env_file:                                                                                                                                                                                                              
      - .env
                                                                                                                                                                                          
    restart: unless-stopped                                                                                                                                                                                                               
    environment:                                                                                                                                                                                                           
      - C_FORCE_ROOT=true                                                                                                                                                                                                  
      - DATABASE_URL=${DATABASE_URL}                                                                                                                                                                                       
      - REDIS_URL=${REDIS_URL}                                                                                                                                                                                             
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}                                                                                                                                                                          
      - VECTOR_DB_URL=${QDRANT_URL}  
    depends_on:                                                                                                                                                                                                            
      - db                                                                                                                                                                                                                 
      - redis                                                                                                                                                                                                              
                                                                                                                                                                                                                           
  frontend:                                                                                                                                                                                                                
    build:
      context: ./apps/client-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}                                                                                                                                                                                             
    ports:                                                                                                                                                                                                                 
      - "3000:3000"
    env_file:
      - .env                                                                                                                                                                                                        
    environment:                                                                                                                                                                                                           
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}                                                                                                                                                                
    depends_on:                                                                                                                                                                                                            
      - backend                                                                                                                                                                                                            
  admin:
    build: 
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports: 
      - "3001:3001" 
    env_file:
      - .env
    environment: 
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
    depends_on: 
      - backend   
                                                                                                                                                                                          
volumes:                                                                                                                                                                                                                   
  db_data:                                                                                                                                                                                                                 
  minio_data:                                                                                                                                                                                                              
  qdrant_data:  