services:                                                                                                                                                                                                                  
  backend:                                                                                                                                                                                                                 
    build: ./apps/api-server                                                                                                                                                                                               
    ports:                                                                                                                                                                                                                 
      - "8000:8000"                                                                                                                                                                                                        
    depends_on:                                                                                                                                                                                                            
      - db                                                                                                                                                                                                                 
      - minio                                                                                                                                                                                                              
      - vector_db                                                                                                                                                                                                          
      - redis                                                                                                                                                                                                              
    env_file:                                                                                                                                                                                                              
      - .env                                                                                                                                                                                                               
    environment:                                                                                                                                                                                                           
      - DATABASE_URL=${DATABASE_URL}                                                                                                                                                                                       
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}                                                                                                                                                                          
      - VECTOR_DB_URL=${QDRANT_URL}                                                                                                                                                                                        
      - REDIS_URL=${REDIS_URL}                                                                                                                                                                                             
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ---------------------------------------------------------------------------
  # API gateway / load balancer (demo: single backend node)
  # ---------------------------------------------------------------------------
  # Sits in front of the FastAPI backend. All browser/UI API traffic goes
  # through this service at http://localhost:8080.
  #
  # To scale the backend later (docker compose up --scale backend=N):
  #   1. Remove or change the direct ports "8000:8000" on the backend service
  #      because N replicas cannot bind the same host port.
  #   2. Add more `server backend:8000;` entries to the upstream block in
  #      infra/nginx/nginx.conf (or rely on Docker DNS round-robin).
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine                                                                                                                                                                                              
    environment:                                                                                                                                                                                                           
      - POSTGRES_DB=ragdb                                                                                                                                                                                                  
      - POSTGRES_USER=postgres                                                                                                                                                                                             
      - POSTGRES_PASSWORD=12345678                                                                                                                                                                                         
    volumes:                                                                                                                                                                                                               
      - db_data:/var/lib/postgresql/data                                                                                                                                                                                   
                                                                                                                                                                                                                           
  minio:                                                                                                                                                                                                                   
    image: minio/minio:latest                                                                                                                                                                                              
    ports:                                                                                                                                                                                                                 
      - "9000:9000"                                                                                                                                                                                                        
      - "9001:9001"                                                                                                                                                                                                        
    environment:                                                                                                                                                                                                           
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}                                                                                                                                                                                
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}                                                                                                                                                                            
    volumes:                                                                                                                                                                                                               
      - minio_data:/data                                                                                                                                                                                                   
    command: server --console-address ":9001" /data                                                                                                                                                                        
                                                                                                                                                                                                                           
  vector_db:                                                                                                                                                                                                               
    image: qdrant/qdrant:latest                                                                                                                                                                                            
    ports:                                                                                                                                                                                                                 
      - "6333:6333"                                                                                                                                                                                                        
    volumes:                                                                                                                                                                                                               
      - qdrant_data:/qdrant/storage                                                                                                                                                                                        
                                                                                                                                                                                                                           
  redis:                                                                                                                                                                                                                   
    image: redis:7-alpine                                                                                                                                                                                                  
    ports:                                                                                                                                                                                                                 
      - "6379:6379"                                                                                                                                                                                                        
                                                                                                                                                                                                                           
  worker:                                                                                                                                                                                                                  
    build: ./apps/api-server                                                                                                                                                                                             
    command: celery -A app.workers.celery_app worker -Q ingestion --loglevel=info                                                                                                                                          
    env_file:                                                                                                                                                                                                              
      - .env                                                                                                                                                                                                               
    environment:                                                                                                                                                                                                           
      - C_FORCE_ROOT=true                                                                                                                                                                                                  
      - DATABASE_URL=${DATABASE_URL}                                                                                                                                                                                       
      - REDIS_URL=${REDIS_URL}                                                                                                                                                                                             
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}                                                                                                                                                                          
      - VECTOR_DB_URL=${QDRANT_URL}                                                                                                                                                                                        
    depends_on:                                                                                                                                                                                                            
      - db                                                                                                                                                                                                                 
      - redis                                                                                                                                                                                                              
                                                                                                                                                                                                                           
  frontend:                                                                                                                                                                                                                
    build:
      context: ./apps/client-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}                                                                                                                                                                                             
    ports:                                                                                                                                                                                                                 
      - "3000:3000"
    env_file:
      - .env                                                                                                                                                                                                        
    environment:                                                                                                                                                                                                           
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}                                                                                                                                                                
    depends_on:                                                                                                                                                                                                            
      - backend                                                                                                                                                                                                            
  admin:
    build: 
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports: 
      - "3001:3001" 
    env_file:
      - .env
    environment: 
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
    depends_on: 
      - backend                                                                                                                                                                                                           
volumes:                                                                                                                                                                                                                   
  db_data:                                                                                                                                                                                                                 
  minio_data:                                                                                                                                                                                                              
  qdrant_data:  