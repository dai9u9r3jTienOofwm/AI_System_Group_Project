services:
  backend:
    ports:
      - "8080:80"
    depends_on:
      - db
      - object_store
      - vector_db
    environment:
       DATABASE_URL: postgresql://postgres:123456@db:5432/ragdb
       OBJECT_STORAGE_ENDPOINT: http://object_store:9000
       OBJECT_STORAGE_ACCESS_KEY: admin_1
       OBJECT_STORAGE_SECRET_KEY: admin_1
       VECTOR_DB_URL: http://vector_db:6333  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000   
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ragdb
      - POSTGRES_PASSWORD=123456
      
    volumes:
      - db_data:/var/lib/postgresql/data  

  object_store:  
    image: minio/minio:latest
    ports:
     - "9000:9000"
     - "9001:9001"  
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin_1
      MINIO_ROOT_PASSWORD: admin_1   
    command: server --console-address ":9001" /data

  vector_db:
    image: qdrant/qdrant:latest 
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

volumes:
  db_data:
  minio_data:
  qdrant_data: