services:
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
      - vector_db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}
      - VECTOR_DB_URL=${QDRANT_URL}
      - REDIS_URL=${REDIS_URL}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ragdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678  
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data

  vector_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker:
    build: .
    # Lệnh này cực kỳ quan trọng: chạy Celery thay vì Uvicorn
    command: celery -A app.workers.celery_app worker -Q ingestion --loglevel=info
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OBJECT_STORAGE_ENDPOINT=${MINIO_ENDPOINT}
      - VECTOR_DB_URL=${QDRANT_URL}
    depends_on:
      - db
      - redis
volumes:
  db_data:
  minio_data:
  qdrant_data: