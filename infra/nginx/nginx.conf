# =============================================================================
# Nginx configuration — AI System Group Project local demo
# =============================================================================
# Serves as reverse proxy / API gateway in front of a single FastAPI backend
# (service name "backend", port 8000).
#
# How to extend for production:
#   - Add additional backend:8000 entries to the upstream block.
#   - Remove the direct `ports: 8000:8000` mapping from docker-compose.yml
#     once Nginx is the sole entry point.
# =============================================================================

events {
    worker_connections  1024;
}

http {
    # ---- Upstream -----------------------------------------------------------
    # In the demo phase a single backend node is sufficient.
    # To scale, simply list more `server backend:8000;` entries here.
    upstream backend_pool {
        # Default algorithm is round-robin; least_conn can be used for
        # workloads with uneven request durations (chat/RAG).
        # least_conn;
        server backend:8000;
    }

    # ---- Logging ------------------------------------------------------------
    # Default combined format; sufficient to trace requests during demo.
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # ---- Server -------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------------------
        # 1. Nginx-local health check (independent of backend)
        # --------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # --------------------------------------------------------------
        # 2. Proxy everything else to the backend
        # --------------------------------------------------------------
        location / {
            proxy_pass http://backend_pool;

            # Forward real client information to the backend
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;

            # ---- Upload size -----------------------------------------------
            # Large enough for document uploads in the local demo (PDF, etc.)
            client_max_body_size 50m;

            # ---- Timeouts --------------------------------------------------
            # Generous values so chat/RAG/ingestion requests are not killed
            # prematurely.
            proxy_connect_timeout   90s;
            proxy_send_timeout      90s;
            proxy_read_timeout      300s;  # 5 minutes for slow LLM responses

            # ---- Buffering -------------------------------------------------
            proxy_buffering         off;   # stream responses in real time
        }
    }
}
